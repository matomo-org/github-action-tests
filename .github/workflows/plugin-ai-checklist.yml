name: AI Checklist

on:
  workflow_call: {}

permissions:
  actions: read
  checks: none
  contents: none
  deployments: none
  issues: none
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  AiChecklist:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - name: Run tests
        uses: matomo-org/github-action-checklist-gate@d5f101a2538ef30ddb3b06cc366f852c9851b588 # main as of 2026-08-04
