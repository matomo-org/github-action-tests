name: PHPStan check

on:
  workflow_call:
    inputs:
      plugin-name:
        description: "Name of the plugin, e.g. LoginLdap"
        required: true
        type: string
      dependent-plugins:
        description: "Space-separated repository slugs to check out, e.g. 'innocraft/plugin-Funnels'"
        required: false
        type: string
        default: ''
      php-version:
        description: "PHP version the job runs on; the analysis level and phpVersion come from the plugin's phpstan.neon"
        required: false
        type: string
        default: '7.2'
      verify-hook:
        description: "Fail when the plugin's .git-hooks-matomo/pre-push differs from the canonical copy in this repository"
        required: false
        type: boolean
        default: true
    secrets:
      TESTS_ACCESS_TOKEN:
        required: false

permissions:
  actions: read
  checks: read
  contents: read
  deployments: none
  issues: read
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: read

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    env:
      PLUGIN_NAME: ${{ inputs.plugin-name }}
      DEPENDENT_PLUGINS: ${{ inputs.dependent-plugins }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$PLUGIN_NAME" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "Invalid plugin-name: $PLUGIN_NAME"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}

      # job.workflow_repository/job.workflow_sha resolve to this reusable workflow's
      # own repo and commit, so the helper scripts are version-locked to whatever
      # ref the caller pinned instead of floating on main.
      - name: Check out github-action-tests repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: github-action-tests
          persist-credentials: false

      - name: Check the pre-push hook matches the canonical copy
        if: ${{ inputs.verify-hook }}
        shell: bash
        run: diff -u github-action-tests/hooks/pre-push .git-hooks-matomo/pre-push

      - name: checkout matomo for plugin builds
        shell: bash
        run: ${{ github.workspace }}/github-action-tests/scripts/bash/checkout_matomo.sh
        env:
          WORKSPACE: ${{ github.workspace }}
          ACTION_PATH: ${{ github.workspace }}/github-action-tests
          MATOMO_TEST_TARGET: maximum_supported_matomo

      - name: prepare setup
        shell: bash
        run: |
          cd ${{ github.workspace }}/matomo
          echo -e "composer install"
          composer install --ignore-platform-reqs

      - name: checkout additional plugins
        if: ${{ inputs.dependent-plugins != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}/matomo
        run: ${{ github.workspace }}/github-action-tests/scripts/bash/checkout_dependent_plugins.sh
        env:
          GITHUB_USER_TOKEN: ${{ secrets.TESTS_ACCESS_TOKEN || github.token }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

      - name: "Restore result cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/phpstan # same as in phpstan.neon
          key: "phpstan-result-cache-${{ github.run_id }}"
          restore-keys: |
            phpstan-result-cache-

      - name: PHPStan whole repo
        id: phpstan-all
        run: cd ${{ github.workspace }}/matomo && composer run phpstan -- -vvv -c "plugins/${PLUGIN_NAME}/phpstan.neon"

      - name: "Save result cache"
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          path: /tmp/phpstan # same as in phpstan.neon
          key: "phpstan-result-cache-${{ github.run_id }}"
