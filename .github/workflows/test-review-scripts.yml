name: Test review scripts

on:
  push:
    branches: [main]
    paths:
      - 'review/**'
      - 'package.json'
      - '.github/workflows/test-review-scripts.yml'
      # Also run when the reusable workflow changes: post-review.test.js asserts the CODEX_REVIEW_MARKER
      # literal stays byte-identical between post-review.js and codex-review.yml, so a change to the
      # workflow's copy must trigger the guard.
      - '.github/workflows/codex-review.yml'
  pull_request:
    paths:
      - 'review/**'
      - 'package.json'
      - '.github/workflows/test-review-scripts.yml'
      - '.github/workflows/codex-review.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run review script tests
        run: npm test
