name: Tests

on: pull_request

permissions:
  contents: read

jobs:
  license-check-script:
    name: License check script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run tests
        run: bash tests/license_check_test.sh
