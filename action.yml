name: 'Matomo Tests'
description: 'Runs Matomo Tests'
inputs:
  test-type:
    type: choice
    description: "Type of tests to run"
    required: true
    options:
      - UI
      - PluginTests
      - JS
      - Client
      - UnitTests
      - SystemTestsPlugins
      - SystemTestsCore
      - IntegrationTestsCore
      - IntegrationTestsPlugins
    default: PluginTests
  artifacts-pass:
    description: "UI upload pass"
    required: false
  artifacts-protected:
    type: boolean
    description: "protect uploaded artifacts"
    required: false
    default: false
  plugin-name:
    description: "Name of the plugin to test"
    required: false
  mysql-driver:
    description: "Mysql driver to use for testing. (Will be placed as config.ini.php setting)"
    required: false
    options:
      - PDO_MYSQL
      - MYSQLI
    default: 'PDO_MYSQL'
  ui-test-options:
    description: "Additional options to run UI tests with"
    required: false
  phpunit-test-options:
    description: "Additional options to run PHPUnit with"
    required: false
  php-version:
    description: 'PHP version to set up for testing. Can be any version supported by shivammathur/setup-php'
    required: true
    default: ''
  node-version:
    description: 'Node version to set up for testing'
    required: false
    default: ''
  redis-service:
    type: boolean
    description: "If true a redis master and sentinel will be set up before testing"
    required: false
    default: false
  mysql-service:
    type: boolean
    description: "If true a MySQL engine will be set up. "
    required: false
    default: true
  mysql-engine:
    description: "MySQL database engine to use. Can be 'Mysql', 'Mariadb' or 'Tidb'"
    options:
      - Mysql
      - Mariadb
      - Tidb
    required: false
    default: 'Mysql'
  mysql-version:
    description: "Mysql version to use for testing. Defaults to '5.7' for 'Mysql', and 'latest' for 'Mariadb' or 'Tidb'"
    required: false
    default: ''
  service-image-cache:
    type: boolean
    description: "If true, database and redis images are loaded from the repository's Actions cache when pulling them keeps failing. Push and scheduled runs store a copy of each image there when it has none yet."
    required: false
    default: true
  mysql-timezone:
    description: "Timezone for the database container, e.g. 'Pacific/Auckland'. Defaults to UTC, which is what CI has always run. A non-UTC value makes the server report that zone as SYSTEM, exercising code that reads dates out of the DATETIME columns Matomo stores in UTC."
    required: false
    default: 'UTC'
  matomo-test-branch:
    description: "Branch or tag name of Matomo to run plugin tests for. This can be either a specific name or maximum_supported_matomo or minimum_required_matomo."
    required: false
    default: ''
  dependent-plugins:
    description: "Additional plugins to checkout before testing. space separated list of github slugs. e.g. matomo-org/pluginTasksTimetable"
    required: false
    default: ''
  github-token:
    description: "Token used to checkout dependent plugins. Only required if private repo needs to be checked out"
    required: false
    default: ''
  upload-artifacts:
    type: boolean
    description: "Defines if produced build artifacts should be uploaded or not. Only relevant for System, Plugins and UI tests"
    required: false
    default: false
  setup-script:
    description: "Additional setup script to run before starting tests. Can be used by plugin to e.g. set up LDAP or similar."
    required: false
    default: ''
  testomatio:
    description: "To enable Testomat.io reporter for tests, Testomat.io token should be set via this input"
    required: false
    default: ''
  testomatio-force-report:
    description: "Flag for whether to force uploading a report to Testomat.io instead of just push events. Only applies if the 'testomatio' token is set."
    required: false
    default: false
  report-deprecations:
    type: boolean
    description: "Report PHP deprecations that Matomo hides by default on PHP 8.4 and later, by setting MATOMO_REPORT_DEPRECATIONS for the tests and the web server."
    required: false
    default: false

runs:
  using: "composite"
  steps:

    - name: enable deprecation reporting
      if: inputs.report-deprecations == 'true'
      shell: bash
      run: echo "MATOMO_REPORT_DEPRECATIONS=1" >> "$GITHUB_ENV"

    - name: Pull service images
      id: service-images
      if: inputs.mysql-service == 'true' || inputs.redis-service == 'true'
      shell: bash
      env:
        MYSQL_SERVICE: ${{ inputs.mysql-service }}
        MYSQL_ENGINE: ${{ inputs.mysql-engine }}
        MYSQL_VERSION: ${{ inputs.mysql-version }}
        REDIS_SERVICE: ${{ inputs.redis-service }}
      run: |
        database='' redis=''
        if [ "$MYSQL_SERVICE" = true ]; then
          # Case-insensitive like the expressions that pick the start step.
          case "${MYSQL_ENGINE,,}" in
            mysql) database="mirror.gcr.io/library/mysql:${MYSQL_VERSION:-5.7}" ;;
            mariadb) database="mirror.gcr.io/library/mariadb:${MYSQL_VERSION:-latest}" ;;
            tidb) database="mirror.gcr.io/pingcap/tidb:${MYSQL_VERSION:-latest}" ;;
          esac
        fi
        # Pinned by version tag, not digest: a copy loaded from the cache keeps its tag but loses its digest.
        [ "$REDIS_SERVICE" != true ] || redis=mirror.gcr.io/library/redis:8.6.3
        failed=false
        for service in database redis; do
          image=${!service}
          [ -n "$image" ] || continue
          name=${image#mirror.gcr.io/}
          echo "$service=$image" >> "$GITHUB_OUTPUT"
          # One cache entry per image, so jobs and branches share copies.
          echo "$service-key=matomo-service-image-${name//[^a-zA-Z0-9.]/-}" >> "$GITHUB_OUTPUT"
          if [ "$failed" = false ]; then
            for attempt in 1 2 3; do
              docker pull -q "$image" && continue 2
              [ "$attempt" = 3 ] || sleep $((attempt * 10))
            done
            echo "::warning::Could not pull $image"
            failed=true
          fi
          echo "$service-missing=true" >> "$GITHUB_OUTPUT"
        done

    - name: Restore the database image from the Actions cache
      id: database-image-restore
      if: steps.service-images.outputs.database-missing == 'true' && inputs.service-image-cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/matomo-service-images/database
        key: ${{ steps.service-images.outputs.database-key }}

    - name: Restore the redis image from the Actions cache
      id: redis-image-restore
      if: steps.service-images.outputs.redis-missing == 'true' && inputs.service-image-cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/matomo-service-images/redis
        key: ${{ steps.service-images.outputs.redis-key }}

    - name: Load service images
      # A broken copy must not fail the job here, starting the service then tries to pull once more.
      continue-on-error: true
      if: steps.database-image-restore.outputs.cache-hit == 'true' || steps.redis-image-restore.outputs.cache-hit == 'true'
      shell: bash
      run: |
        for archive in "$RUNNER_TEMP"/matomo-service-images/*/image.tar; do
          docker load -i "$archive"
        done

    # Push and scheduled runs store a copy of each pulled image the cache does not have yet.
    # Storing must never fail a job, so these steps continue on errors.
    - name: Check the Actions cache for the database image
      id: database-image-cached
      continue-on-error: true
      if: steps.service-images.outputs.database != '' && steps.service-images.outputs.database-missing != 'true' && inputs.service-image-cache == 'true' && (github.event_name == 'push' || github.event_name == 'schedule')
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/matomo-service-images/database
        key: ${{ steps.service-images.outputs.database-key }}
        lookup-only: true

    - name: Check the Actions cache for the redis image
      id: redis-image-cached
      continue-on-error: true
      if: steps.service-images.outputs.redis != '' && steps.service-images.outputs.redis-missing != 'true' && inputs.service-image-cache == 'true' && (github.event_name == 'push' || github.event_name == 'schedule')
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/matomo-service-images/redis
        key: ${{ steps.service-images.outputs.redis-key }}
        lookup-only: true

    - name: Save service images
      id: service-images-save
      continue-on-error: true
      if: (steps.database-image-cached.outcome == 'success' && steps.database-image-cached.outputs.cache-hit != 'true') || (steps.redis-image-cached.outcome == 'success' && steps.redis-image-cached.outputs.cache-hit != 'true')
      shell: bash
      env:
        DATABASE: ${{ steps.database-image-cached.outcome == 'success' && steps.database-image-cached.outputs.cache-hit != 'true' && steps.service-images.outputs.database || '' }}
        REDIS: ${{ steps.redis-image-cached.outcome == 'success' && steps.redis-image-cached.outputs.cache-hit != 'true' && steps.service-images.outputs.redis || '' }}
      run: |
        for service in DATABASE REDIS; do
          [ -n "${!service}" ] || continue
          mkdir -p "$RUNNER_TEMP/matomo-service-images/${service,,}"
          docker save -o "$RUNNER_TEMP/matomo-service-images/${service,,}/image.tar" "${!service}"
        done

    - name: Store the database image in the Actions cache
      continue-on-error: true
      if: steps.service-images-save.outcome == 'success' && steps.database-image-cached.outcome == 'success' && steps.database-image-cached.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/matomo-service-images/database
        key: ${{ steps.service-images.outputs.database-key }}

    - name: Store the redis image in the Actions cache
      continue-on-error: true
      if: steps.service-images-save.outcome == 'success' && steps.redis-image-cached.outcome == 'success' && steps.redis-image-cached.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/matomo-service-images/redis
        key: ${{ steps.service-images.outputs.redis-key }}

    - name: Remove the service image archives
      # Docker holds the images now, so the archives only take disk space.
      if: steps.service-images.outputs.database-key != '' || steps.service-images.outputs.redis-key != ''
      shell: bash
      run: rm -rf "$RUNNER_TEMP/matomo-service-images"

    - name: start mysql services
      if: inputs.mysql-service == 'true' && inputs.mysql-engine == 'Mysql'
      shell: bash
      env:
        MYSQL_TIMEZONE: ${{ inputs.mysql-timezone || 'UTC' }}
      run: |
        docker run -d \
          --tmpfs /var/lib/mysql:rw \
          -v ${{ github.action_path }}/artifacts/my.cnf:/etc/mysql/conf.d/my_custom.cnf:ro \
          --name mysql \
          -p 3306:3306 \
          -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
          -e MYSQL_DATABASE=matomo_tests \
          -e TZ="$MYSQL_TIMEZONE" \
          ${{ steps.service-images.outputs.database }}

        for i in $(seq 1 30); do
          if mysqladmin ping -h127.0.0.1 -uroot --silent; then
            break
          fi
          sleep 1
        done

        mysql -h127.0.0.1 -uroot -e "
          SET GLOBAL sql_mode = 'NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES';
          SET GLOBAL wait_timeout = 36000;
          SET GLOBAL max_allowed_packet = 134209536;
          SET GLOBAL local_infile = On;
        "

    - name: start mariadb services
      if: inputs.mysql-service == 'true' && inputs.mysql-engine == 'Mariadb'
      shell: bash
      env:
        MYSQL_TIMEZONE: ${{ inputs.mysql-timezone || 'UTC' }}
      run: |
        docker run -d \
          --tmpfs /var/lib/mysql:rw \
          -v ${{ github.action_path }}/artifacts/my.cnf:/etc/mysql/conf.d/my_custom.cnf:ro \
          --name mariadb \
          -p 3306:3306 \
          -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 \
          -e MARIADB_DATABASE=matomo_tests \
          -e TZ="$MYSQL_TIMEZONE" \
          ${{ steps.service-images.outputs.database }}

        for i in $(seq 1 30); do
          if mysqladmin ping -h127.0.0.1 -uroot --silent; then
            break
          fi
          sleep 1
        done

        mysql -h127.0.0.1 -uroot -e "
          SET GLOBAL sql_mode = 'NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES';
          SET GLOBAL wait_timeout = 36000;
          SET GLOBAL max_allowed_packet = 134209536;
          SET GLOBAL local_infile = On;
        "

    - name: start tidb services
      if: inputs.mysql-service == 'true' && inputs.mysql-engine == 'Tidb'
      shell: bash
      env:
        MYSQL_TIMEZONE: ${{ inputs.mysql-timezone || 'UTC' }}
      run: |
        docker run -d \
          -p 3306:4000 \
          -e TZ="$MYSQL_TIMEZONE" \
          ${{ steps.service-images.outputs.database }}

        for i in $(seq 1 30); do
          if mysqladmin ping -h127.0.0.1 -uroot --silent; then
            break
          fi
          sleep 1
        done

        mysql -h127.0.0.1 -uroot -e "
          SET GLOBAL sql_mode = 'NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES';
          SET GLOBAL wait_timeout = 36000;
          SET GLOBAL max_allowed_packet = 134209536;
          SET GLOBAL local_infile = On;
          CREATE DATABASE matomo_tests;
        "

    - name: start redis services
      if: inputs.redis-service == 'true'
      shell: bash
      env:
        REDIS_IMAGE: ${{ steps.service-images.outputs.redis }}
      run: |
        docker run -d --name redis -p 6379:6379 "$REDIS_IMAGE"
        docker run -d --name mymaster -p 26379:26379 "$REDIS_IMAGE" \
          sh -c 'printf "port 26379\nsentinel monitor mymaster 127.0.0.1 6379 1\n" > /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf'

    - name: Resolve PHP version
      id: resolve-php
      shell: bash
      # the alias table lives in scripts/bash/resolve_php_version.sh so anything else needing
      # these versions resolves the same table instead of copying it. The input arrives through
      # the environment rather than an expression, so a caller's value is never expanded as shell.
      env:
        PHP_VERSION_INPUT: ${{ inputs.php-version }}
      run: |
        RESOLVED_VERSION=$("${{ github.action_path }}/scripts/bash/resolve_php_version.sh" "$PHP_VERSION_INPUT")

        echo "version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"

    - name: Setup PHP
      if: steps.resolve-php.outputs.version != ''
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ steps.resolve-php.outputs.version }}
        extensions: bcmath, ldap, curl, zip, pdo_mysql, mysqli, gd, redis, zlib, opcache
        ini-values: |
          post_max_size=8M,
          memory_limit=768M,
          max_execution_time=10000,
          always_populate_raw_post_data=-1,
          error_reporting=E_ALL,
          log_errors=on,
          error_log=${{ github.workspace }}/php-errors.log,
          display_errors=on,
          allow_url_fopen=on,
          zend.exception_ignore_args=Off,
          mysqli.allow_local_infile=On,
          opcache.enable=0,
          fatal_error_backtraces=Off
        tools: composer:v2
        coverage: none

    - name: Setup Node
      if: inputs.node-version != '' && inputs.plugin-name == ''
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    # Caching doesn't work for plugins as older Matomo releases might not have contained a lock file
    - name: Setup Node
      if: inputs.node-version != '' && inputs.plugin-name != ''
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}

    - name: "Add PHPUnit matcher"
      if: inputs.test-type != 'UI' && inputs.test-type != 'JS' && inputs.test-type != 'Client'
      shell: bash
      run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    # setup apache etc
    - name: checkout matomo for plugin builds
      shell: bash
      run: ${{ github.action_path }}/scripts/bash/checkout_matomo.sh
      if: inputs.plugin-name != ''
      env:
        PLUGIN_NAME: ${{ inputs.plugin-name }}
        WORKSPACE: ${{ github.workspace }}
        ACTION_PATH: ${{ github.action_path }}
        MATOMO_TEST_TARGET: ${{ inputs.matomo-test-branch }}
        TEST_SUITE: ${{ inputs.test-type }}

    - name: Get composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      working-directory: ${{ github.workspace }}/matomo

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ steps.resolve-php.outputs.version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-${{ steps.resolve-php.outputs.version }}
          ${{ runner.os }}-composer

    # setup apache etc
    - name: prepare setup
      shell: bash
      run: ${{ github.action_path }}/scripts/bash/prepare.sh
      env:
        PHP_VERSION: ${{ steps.resolve-php.outputs.version }}
        TEST_SUITE: ${{ inputs.test-type }}
        MATOMO_TEST_TARGET: ${{ inputs.matomo-test-branch }}
        MYSQL_ADAPTER: ${{ inputs.mysql-driver }}
        MYSQL_ENGINE: ${{ inputs.mysql-engine }}
        MYSQL_VERSION: ${{ inputs.mysql-version }}
        PLUGIN_NAME: ${{ inputs.plugin-name }}
        WORKSPACE: ${{ github.workspace }}
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}

    - name: checkout additional plugins
      if: inputs.dependent-plugins != ''
      shell: bash
      run: ${{ github.action_path }}/scripts/bash/checkout_dependent_plugins.sh
      working-directory: ${{ github.workspace }}/matomo
      env:
        DEPENDENT_PLUGINS: ${{ inputs.dependent-plugins }}
        GITHUB_USER_TOKEN: ${{ inputs.github-token }}
        TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

    - name: run additional setup script
      if: inputs.setup-script != ''
      shell: bash
      run: ${{ github.workspace }}/${{ inputs.setup-script }}
      working-directory: ${{ github.workspace }}/matomo
      env:
        PHP_VERSION: ${{ steps.resolve-php.outputs.version }}
        TEST_SUITE: ${{ inputs.test-type }}
        MATOMO_TEST_TARGET: ${{ inputs.matomo-test-branch }}
        PLUGIN_NAME: ${{ inputs.plugin-name }}
        WORKSPACE: ${{ github.workspace }}
        ACTION_PATH: ${{ github.action_path }}

    - name: Install package ripgrep
      shell: bash
      run: sudo apt-get install ripgrep
      working-directory: ${{ github.workspace }}/matomo

    - name: Run tests
      working-directory: ${{ github.workspace }}/matomo
      shell: bash
      run: ${{ github.action_path }}/scripts/bash/run_tests.sh
      env:
        TEST_SUITE: ${{ inputs.test-type }}
        PLUGIN_NAME: ${{ inputs.plugin-name }}
        UITEST_EXTRA_OPTIONS: ${{ inputs.ui-test-options }}
        PHPUNIT_EXTRA_OPTIONS: ${{ inputs.phpunit-test-options }}
        GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
        GITHUB_IS_TRIGGERED_BY_PUSH: ${{ github.event_name == 'push' && 'true' || 'false' }}
        MYSQL_ADAPTER: ${{ inputs.mysql-driver }}
        MYSQL_ENGINE: ${{ inputs.mysql-engine }}
        MYSQL_VERSION: ${{ inputs.mysql-version }}
        TESTOMATIO: ${{ inputs.testomatio }}
        TESTOMATIO_CREATE: 1
        TESTOMATIO_FORCE_REPORT: ${{ inputs.testomatio-force-report }}
        TESTOMATIO_ENV: PHP-${{ steps.resolve-php.outputs.version }}, ${{ inputs.mysql-driver }}, ${{ inputs.mysql-engine }}
        TRAVIS: '1'

    - name: Debug informations
      if: always()
      working-directory: ${{ github.workspace }}/matomo
      shell: bash
      run: |
        echo "::group::PHP configuration"
        php -i || true
        echo "::endgroup::"
        echo "::group::Matomo configuration file"
        cat config/config.ini.php || true
        echo "::endgroup::"
        echo "::group::Matomo error log file"
        cat tmp/logs/matomo.log || true
        echo "::endgroup::"
        echo "::group::PHP error log file"
        cat ${{ github.workspace }}/php-errors.log || true
        echo "::endgroup::"
        echo "::group::Nginx error log file"
        cat ${{ github.workspace }}/matomo/tmp/error.log || true
        echo "::endgroup::"

    - name: upload processed screenshots
      if: always() && inputs.upload-artifacts == 'true' && (inputs.test-type == 'UI' || inputs.test-type == 'SystemTestsPlugins' || inputs.test-type == 'SystemTestsCore' || inputs.test-type == 'PluginTests')
      shell: bash
      run: ${{ github.action_path }}/scripts/bash/upload_artifacts.sh
      env:
        ARTIFACTS_PASS: ${{ inputs.artifacts-pass }}
        ARTIFACTS_PROTECTED: ${{ inputs.artifacts-protected == 'true' }}
        TEST_SUITE: ${{ inputs.test-type }}
        PLUGIN_NAME: ${{ inputs.plugin-name }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
        GITHUB_RUN_ID: ${{ github.run-id }}
        GITHUB_RUN_NUMBER: ${{ github.run-number }}
        WORKSPACE: ${{ github.workspace }}/matomo
